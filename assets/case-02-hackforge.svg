      <stop offset="0" stop-color="#021125"/>
      <stop offset="0.55" stop-color="#07314a"/>
      <stop offset="1" stop-color="#03463e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
