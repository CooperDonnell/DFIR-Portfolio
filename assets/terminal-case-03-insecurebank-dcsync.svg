<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc">
  <title id="title">InsecureBank DCSync Event Log Investigation</title>
  <desc id="desc">Terminal-style blue and green case card for an Active Directory DCSync event log investigation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02060d"/>
      <stop offset="0.62" stop-color="#031924"/>
      <stop offset="1" stop-color="#03352f"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#8bfaff" opacity="0.055"/>
    </pattern>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#00e5ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="760" height="270" rx="18" fill="url(#bg)"/>
  <rect width="760" height="270" rx="18" fill="url(#grid)"/>
  <rect width="760" height="270" rx="18" fill="url(#scanlines)"/>
  <line x1="0" y1="42" x2="760" y2="42" stroke="#00ff8a" stroke-width="2" opacity="0.75"/>
  <text x="28" y="28" fill="#00ff8a" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">case-03:~$</text>
  <text x="596" y="28" fill="#00e5ff" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="15">ad</text>
  <text x="642" y="28" fill="#00e5ff" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="15">evtx</text>

  <rect x="34" y="68" width="692" height="112" fill="#020911" opacity="0.58" stroke="#00ff8a" stroke-width="2"/>
  <rect x="40" y="74" width="680" height="100" fill="none" stroke="#00e5ff" stroke-opacity="0.32"/>
  <g font-family="Fira Code, SFMono-Regular, Consolas, monospace" filter="url(#glow)">
    <text x="58" y="108" fill="#00ff8a" font-size="27" font-weight="800" letter-spacing="2">INSECUREBANK DCSYNC EVENT LOG</text>
    <text x="60" y="142" fill="#00e5ff" font-size="17" font-weight="700">Security 4662 | Control Access | replication GUID</text>
  </g>

  <g font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="16">
    <text x="36" y="209" fill="#00e5ff" font-weight="700">key findings:</text>
    <rect x="158" y="194" width="9" height="20" fill="#00ff8a"/>
    <text x="36" y="236" fill="#b9fff0">Administrator | DC1.insecurebank.local | AccessMask 0x100</text>
  </g>
  <g font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="700">
    <rect x="526" y="198" width="78" height="28" fill="#00e5ff" opacity="0.16" stroke="#00e5ff"/>
    <text x="542" y="217" fill="#c8f8ff">EVTX</text>
    <rect x="618" y="198" width="108" height="28" fill="#00ff8a" opacity="0.16" stroke="#00ff8a"/>
    <text x="634" y="217" fill="#c9ffe8">Event 4662</text>
  </g>
</svg>
