<svg xmlns="http://www.w3.org/2000/svg" width="760" height="240" viewBox="0 0 760 240" role="img" aria-labelledby="title desc">
  <title id="title">Meridian Ransomware Incident</title>
  <desc id="desc">Blue and green case card for a ransomware investigation using disk and network evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031020"/>
      <stop offset="0.55" stop-color="#063047"/>
      <stop offset="1" stop-color="#06443a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
  </defs>
  <rect width="760" height="240" rx="18" fill="url(#bg)"/>
  <path d="M42 58 H220 L256 92 H420 L468 128 H704" fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.55"/>
  <path d="M42 190 H196 L232 158 H370 L420 120 H704" fill="none" stroke="#00ff9c" stroke-width="3" stroke-opacity="0.45"/>
  <circle cx="220" cy="58" r="5" fill="#00e5ff"/>
  <circle cx="420" cy="92" r="5" fill="#00e5ff"/>
  <circle cx="232" cy="158" r="5" fill="#00ff9c"/>
  <text x="42" y="104" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="32" font-weight="800">Meridian Ransomware Incident</text>
  <text x="42" y="140" fill="#d5fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">
    <tspan x="42" dy="0">Disk and PCAP analysis of malicious document staging, C2,</tspan>
    <tspan x="42" dy="28">SMB movement, exfiltration preparation, and LockBit indicators.</tspan>
  </text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="42" y="184" width="96" height="30" rx="8" fill="#00e5ff" opacity="0.14" stroke="#00e5ff"/>
    <text x="64" y="205" fill="#c8f8ff">Autopsy</text>
    <rect x="152" y="184" width="110" height="30" rx="8" fill="#00ff9c" opacity="0.14" stroke="#00ff9c"/>
    <text x="174" y="205" fill="#c9ffe8">Wireshark</text>
    <rect x="276" y="184" width="92" height="30" rx="8" fill="#00e5ff" opacity="0.14" stroke="#00e5ff"/>
    <text x="300" y="205" fill="#c8f8ff">LockBit</text>
  </g>
</svg>
