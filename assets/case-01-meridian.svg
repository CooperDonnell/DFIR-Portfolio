<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">Meridian Ransomware Incident</title>
  <desc id="desc">Case card for a ransomware investigation using disk and network evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171826"/>
      <stop offset="0.55" stop-color="#3a1535"/>
      <stop offset="1" stop-color="#7a1f2d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
  </defs>
  <rect width="720" height="220" rx="20" fill="url(#bg)"/>
  <circle cx="625" cy="42" r="88" fill="#ffb703" opacity="0.13"/>
  <circle cx="660" cy="170" r="120" fill="#ff4d6d" opacity="0.12"/>
  <path d="M42 60 H665" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
  <text x="42" y="105" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Meridian Ransomware Incident</text>
  <text x="42" y="142" fill="#f7d8de" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Disk + PCAP investigation of malicious document staging, C2, SMB movement, exfiltration prep, and LockBit indicators.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">
    <rect x="42" y="164" width="94" height="30" rx="15" fill="#ffb703" opacity="0.2" stroke="#ffb703"/>
    <text x="65" y="185" fill="#ffe6ad">Autopsy</text>
    <rect x="148" y="164" width="108" height="30" rx="15" fill="#21d4fd" opacity="0.18" stroke="#21d4fd"/>
    <text x="170" y="185" fill="#c8f6ff">Wireshark</text>
    <rect x="268" y="164" width="92" height="30" rx="15" fill="#ff4d6d" opacity="0.2" stroke="#ff4d6d"/>
    <text x="293" y="185" fill="#ffd0d8">LockBit</text>
  </g>
</svg>
