<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Cooper Donnell DFIR Portfolio terminal banner</title>
  <desc id="desc">A blue and green terminal-style banner for a digital forensics and incident response portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02060d"/>
      <stop offset="0.58" stop-color="#031924"/>
      <stop offset="1" stop-color="#03352f"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#8bfaff" opacity="0.055"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#scanlines)"/>

  <line x1="0" y1="52" x2="1280" y2="52" stroke="#00ff8a" stroke-width="2" opacity="0.75"/>
  <text x="34" y="34" fill="#00ff8a" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">portfolio:~$</text>
  <text x="840" y="34" fill="#00e5ff" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="16">dfir</text>
  <text x="910" y="34" fill="#00e5ff" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="16">windows</text>
  <text x="1015" y="34" fill="#00e5ff" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="16">memory</text>
  <text x="1115" y="34" fill="#00e5ff" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="16">network</text>

  <rect x="62" y="90" width="650" height="170" fill="#020911" opacity="0.68" stroke="#00ff8a" stroke-width="2"/>
  <rect x="68" y="96" width="638" height="158" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/>
  <g font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-weight="800" filter="url(#glow)">
    <text x="96" y="142" fill="#00ff8a" font-size="38" letter-spacing="3">COOPER DONNELL</text>
    <text x="98" y="182" fill="#00e5ff" font-size="22">Digital Forensics + Incident Response</text>
    <text x="98" y="220" fill="#b9fff0" font-size="18">evidence-driven case reports / public datasets</text>
  </g>

  <g font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="19">
    <text x="62" y="306" fill="#00e5ff" font-weight="700">portfolio information:</text>
    <rect x="315" y="288" width="11" height="24" fill="#00ff8a"/>
    <text x="62" y="342" fill="#a8dce2">Name: Cooper Donnell</text>
    <text x="62" y="372" fill="#a8dce2">Focus: Windows artifacts | memory triage | network forensics</text>
  </g>

  <rect x="762" y="82" width="458" height="288" fill="#020911" opacity="0.32" stroke="#00e5ff" stroke-opacity="0.16"/>
  <text x="780" y="96" fill="#6affc2" font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="18">casework:</text>
  <g font-family="Fira Code, SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="780" y="154" fill="#a8dce2">01 ransomware intrusion</text>
    <text x="780" y="230" fill="#a8dce2">02 unusual process memory</text>
    <text x="780" y="306" fill="#a8dce2">03 dcsync event log</text>
  </g>
  <g fill="none" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)">
    <path d="M1136 134 H1174 L1198 112 H1210" stroke="#00e5ff" opacity="0.82"/>
    <path d="M1136 218 H1174 L1198 242 H1210" stroke="#00ff8a" opacity="0.82"/>
    <path d="M1136 302 H1174 L1198 278 H1210" stroke="#00e5ff" opacity="0.65"/>
  </g>
  <g>
    <circle cx="1136" cy="134" r="6" fill="#00e5ff"/>
    <circle cx="1198" cy="112" r="6" fill="#00e5ff"/>
    <circle cx="1136" cy="218" r="6" fill="#00ff8a"/>
    <circle cx="1198" cy="242" r="6" fill="#00ff8a"/>
    <circle cx="1136" cy="302" r="6" fill="#00e5ff"/>
    <circle cx="1198" cy="278" r="6" fill="#00e5ff"/>
  </g>
</svg>
