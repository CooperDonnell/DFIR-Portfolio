<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Cooper Donnell DFIR Portfolio</title>
  <desc id="desc">Modern blue and green digital forensics portfolio banner with grid and circuit-line styling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#052033"/>
      <stop offset="1" stop-color="#063b3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00ff9c"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8befff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <path d="M40 282 H230 L275 238 H410 L450 204 H600 L636 168 H824 L876 122 H1240" fill="none" stroke="#00ff9c" stroke-width="3" stroke-opacity="0.62" filter="url(#softGlow)"/>
  <path d="M40 96 H174 L222 132 H380 L420 164 H560 L596 200 H760 L808 236 H1240" fill="none" stroke="#00e5ff" stroke-width="3" stroke-opacity="0.58" filter="url(#softGlow)"/>
  <g opacity="0.85">
    <circle cx="230" cy="282" r="6" fill="#00ff9c"/>
    <circle cx="410" cy="238" r="6" fill="#00ff9c"/>
    <circle cx="600" cy="204" r="6" fill="#00ff9c"/>
    <circle cx="824" cy="168" r="6" fill="#00ff9c"/>
    <circle cx="174" cy="96" r="6" fill="#00e5ff"/>
    <circle cx="380" cy="132" r="6" fill="#00e5ff"/>
    <circle cx="560" cy="164" r="6" fill="#00e5ff"/>
    <circle cx="760" cy="200" r="6" fill="#00e5ff"/>
  </g>
  <rect x="54" y="54" width="1172" height="252" rx="18" fill="#03101f" opacity="0.78" stroke="#00e5ff" stroke-opacity="0.24"/>
  <text x="88" y="126" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">Cooper Donnell</text>
  <text x="88" y="184" fill="#d9fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Digital Forensics &amp; Incident Response Portfolio</text>
  <text x="88" y="232" fill="#9dd7dc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Public evidence sets. Defensible findings. Clean technical reporting.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="88" y="260" width="174" height="38" rx="8" fill="#00e5ff" opacity="0.13" stroke="#00e5ff" stroke-opacity="0.85"/>
    <text x="116" y="285" fill="#c8f8ff">Windows Artifacts</text>
    <rect x="278" y="260" width="164" height="38" rx="8" fill="#00ff9c" opacity="0.13" stroke="#00ff9c" stroke-opacity="0.85"/>
    <text x="306" y="285" fill="#c9ffe8">Memory Triage</text>
    <rect x="458" y="260" width="182" height="38" rx="8" fill="#00e5ff" opacity="0.13" stroke="#00e5ff" stroke-opacity="0.85"/>
    <text x="486" y="285" fill="#c8f8ff">Network Forensics</text>
    <rect x="656" y="260" width="126" height="38" rx="8" fill="#00ff9c" opacity="0.13" stroke="#00ff9c" stroke-opacity="0.85"/>
    <text x="684" y="285" fill="#c9ffe8">Reporting</text>
  </g>
</svg>
