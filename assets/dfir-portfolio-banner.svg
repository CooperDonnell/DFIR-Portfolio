<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Cooper Donnell DFIR Portfolio</title>
  <desc id="desc">A colorful digital forensics and incident response portfolio banner with investigation themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.45" stop-color="#132a3d"/>
      <stop offset="1" stop-color="#2b164f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#21d4fd"/>
      <stop offset="0.5" stop-color="#b721ff"/>
      <stop offset="1" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <path d="M0 298 C140 238 230 334 382 276 C520 223 618 180 760 218 C894 254 1008 314 1280 226 L1280 360 L0 360 Z" fill="#21d4fd" opacity="0.18"/>
  <path d="M0 86 C150 124 292 18 428 72 C560 124 606 166 734 124 C888 74 1014 42 1280 112" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.75"/>
  <g filter="url(#shadow)">
    <rect x="46" y="52" width="1188" height="256" rx="22" fill="#0b1220" opacity="0.78" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
  <g transform="translate(86 87)">
    <rect x="0" y="0" width="104" height="104" rx="22" fill="url(#accent)" opacity="0.98"/>
    <path d="M52 19 L81 31 L77 74 L52 88 L27 74 L23 31 Z" fill="#07111f" opacity="0.92"/>
    <path d="M38 47 L50 59 L69 36" fill="none" stroke="#21d4fd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="220" y="124" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800">Cooper Donnell</text>
  <text x="220" y="181" fill="#d7e4f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Digital Forensics &amp; Incident Response Portfolio</text>
  <text x="220" y="232" fill="#9fb4d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Public evidence sets. Defensible findings. Recruiter-ready reporting.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">
    <rect x="220" y="260" width="172" height="38" rx="19" fill="#21d4fd" opacity="0.16" stroke="#21d4fd" stroke-opacity="0.75"/>
    <text x="247" y="285" fill="#bff5ff">Windows Artifacts</text>
    <rect x="410" y="260" width="162" height="38" rx="19" fill="#ffb703" opacity="0.16" stroke="#ffb703" stroke-opacity="0.75"/>
    <text x="439" y="285" fill="#ffe1a3">Memory Triage</text>
    <rect x="590" y="260" width="158" height="38" rx="19" fill="#b721ff" opacity="0.16" stroke="#b721ff" stroke-opacity="0.75"/>
    <text x="619" y="285" fill="#edc7ff">Network Forensics</text>
    <rect x="766" y="260" width="142" height="38" rx="19" fill="#5cf2a8" opacity="0.16" stroke="#5cf2a8" stroke-opacity="0.75"/>
    <text x="794" y="285" fill="#c7ffdf">Reporting</text>
  </g>
</svg>
